version: "3.9"

services:

  # ─────────────────────────────────────────
  # 1. PostgreSQL — Zone Staging + Curated
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: traffic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic123
      POSTGRES_DB: trafficdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d trafficdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 2. MinIO — Zone Raw (stockage objet S3)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: traffic_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 3. MinIO Init — crée le bucket au démarrage
  # ─────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: traffic_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/raw-traffic;
        echo 'Bucket raw-traffic créé.';
      "

  # ─────────────────────────────────────────
  # 4. FastAPI — API Gateway
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: traffic_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://traffic:traffic123@postgres:5432/trafficdb
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      TOMTOM_API_KEY: ${TOMTOM_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 5. Prefect Server — Orchestration UI
  # ─────────────────────────────────────────
  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: traffic_prefect_server
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://traffic:traffic123@postgres:5432/trafficdb
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────
  # 6. Prefect Worker — Exécute les flows
  # ─────────────────────────────────────────
  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: traffic_prefect_worker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      DATABASE_URL: postgresql://traffic:traffic123@postgres:5432/trafficdb
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      TOMTOM_API_KEY: ${TOMTOM_API_KEY}
    volumes:
      - ./src:/app/src
    depends_on:
      - prefect-server
      - postgres
      - minio

  # ─────────────────────────────────────────
  # 7. pgAdmin — Interface web PostgreSQL
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: traffic_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@traffic.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./postgres/pgadmin_servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  pgadmin_data: